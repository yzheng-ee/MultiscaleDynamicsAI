name: panda

# Environment specification, not a complete dependency lock.
# Generate a platform-specific lock after validating the environment on that platform.
channels:
  - conda-forge

dependencies:
  - python=3.11
  - git
  - ipykernel>=7,<8
  - pip
  - pip:
      # Direct dependencies used by our data preparation and training code.
      - numpy==1.26.4
      # CUDA 12.6 wheels for Perlmutter; macOS uses the native PyTorch wheel.
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - "torch==2.13.0+cu126; sys_platform == 'linux'"
      - "torch==2.13.0; sys_platform != 'linux'"
      - accelerate==1.15.0
      - transformers==4.40.2
      - wandb==0.31.0

      # Install the original model code; Panda declares its remaining dependencies.
      - panda @ git+https://github.com/abao1999/panda.git@c229e7c8c49cbe294458c44160248bb17856a715

      # Compatibility constraints for upstream dependencies.
      - huggingface-hub==0.36.2
      - safetensors==0.8.0
      # PyArrow 26 requires NumPy >=2, while upstream Panda requires NumPy <2.
      - pyarrow==25.0.1
      # Transitive dependencies remain unlocked, including upstream's dysts@master.
