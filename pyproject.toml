[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msdyn"
version = "0.1.0"
description = "Multiscale dynamics test-bed (Lorenz '96) for evaluating pretrained chaotic-dynamics forecasters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy<2",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
panda = ["torch", "transformers==4.40.2", "accelerate", "safetensors>=0.4"]
dev = ["pytest>=7", "ruff>=0.5", "ipykernel", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running integration tests",
    "panda: requires the PANDA checkpoint / torch",
]
